name: Dependabot auto-merge

# Merges a Dependabot PR only after this repo's own CI workflow succeeded on that exact head SHA, and
# closes a failing MAJOR bump (Dependabot treats a closed PR as "ignore this version"). The trigger is
# workflow_run, not pull_request + `gh pr merge --auto`: with no required status checks configured,
# --auto merges immediately and the merge would have no gate at all. Update types come from the
# metadata block Dependabot writes into its commit message, so no third-party action is used.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  # One decision at a time per repository: the behind-check and the merge below run under this lock.
  # GitHub keeps only one pending run per group, so a decision dropped here is recovered by the
  # post-merge step, which updates every other open Dependabot branch that is now behind.
  group: dependabot-auto
  cancel-in-progress: false

jobs:
  decide:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_APP: ${{ secrets.DEPENDABOT_AUTO_APP_ID != '' && secrets.DEPENDABOT_AUTO_APP_KEY != '' }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      WF_PATH: ${{ github.event.workflow_run.path }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # With an App installed on the repo, merges and branch updates are made by the App: GITHUB_TOKEN
      # events do not start push or pull_request workflows, so a GITHUB_TOKEN merge would skip deploys
      # and a GITHUB_TOKEN branch update would never re-run CI.
      - name: Mint a repository-scoped App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DEPENDABOT_AUTO_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTO_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Merge a green patch/minor bump, close a failing major bump
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          [ -n "$PR_NUMBER" ] || { echo "workflow run has no pull request; nothing to do"; exit 0; }

          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          [ "$(jq -r .state <<<"$pr")" = open ] || { echo "PR #$PR_NUMBER is not open"; exit 0; }
          [ "$(jq -r .head.sha <<<"$pr")" = "$HEAD_SHA" ] || { echo "PR #$PR_NUMBER head moved past the CI run; a newer run will decide"; exit 0; }
          [ "$(jq -r .user.login <<<"$pr")" = "dependabot[bot]" ] || { echo "PR #$PR_NUMBER is not authored by Dependabot"; exit 0; }

          types=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --jq '.[].commit.message' \
            | grep -oE 'update-type: version-update:semver-(major|minor|patch)' | sort -u || true)
          [ -n "$types" ] || { echo "no update-type metadata in the commit message; leaving PR #$PR_NUMBER to a human"; exit 0; }
          echo "update types: $(tr '\n' ' ' <<<"$types")"

          # Every wait below polls (30 s steps, 40 tries) because this job is triggered once, by the CI workflow
          # finishing: a check or a default-branch run that is still pending at that moment would otherwise never
          # be looked at again.
          if grep -q 'semver-major' <<<"$types"; then
            [ "$CONCLUSION" = failure ] || { echo "major bump with green CI is left to a human"; exit 0; }
            # A security update can be a major bump (dependabot.yml only ignores ordinary majors), and closing it
            # would mark the vulnerable range ignored, so anything that looks like a security update stays open.
            if jq -e '([.labels[].name] | index("security")) or ((.body // "") | test("GHSA-|CVE-|[Vv]ulnerabilit"))' <<<"$pr" >/dev/null; then
              echo "major bump looks like a security update; leaving PR #$PR_NUMBER to a human"; exit 0
            fi
            wf=$(basename "${WF_PATH%%@*}")
            main_sha=$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
            main=none
            for _ in $(seq 1 40); do
              main=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?branch=$DEFAULT_BRANCH&head_sha=$main_sha&per_page=1" \
                --jq '.workflow_runs[0] | if . == null then "none" elif .status != "completed" then "pending" else .conclusion end')
              case "$main" in pending|none) sleep 30 ;; *) break ;; esac
            done
            [ "$main" = success ] || { echo "CI on $DEFAULT_BRANCH at $main_sha is '$main', so this failure may not be the bump's; not closing"; exit 0; }
            gh pr close "$PR_NUMBER" --comment "Closing: this major bump fails this repository's CI on its own head ($HEAD_SHA) while CI on $DEFAULT_BRANCH ($main_sha) is green. A major version is a breaking change that needs a human-written migration; Dependabot treats a closed PR as ignoring this version."
            echo "closed PR #$PR_NUMBER"
            exit 0
          fi

          [ "$CONCLUSION" = success ] || { echo "CI failed on a patch/minor bump; leaving PR #$PR_NUMBER open"; exit 0; }

          # The head must contain the current default-branch tip: another bump may have merged while this one was
          # tested, and --match-head-commit only pins the PR head. A stale branch is updated, which re-runs CI.
          behind=$(gh api "repos/$GH_REPO/compare/$HEAD_SHA...$DEFAULT_BRANCH" --jq .ahead_by)
          if [ "$behind" != 0 ]; then
            gh api -X PUT "repos/$GH_REPO/pulls/$PR_NUMBER/update-branch" -f expected_head_sha="$HEAD_SHA" >/dev/null \
              && echo "PR #$PR_NUMBER was $behind commit(s) behind $DEFAULT_BRANCH; updated the branch, the new CI run decides" \
              || echo "::warning::PR #$PR_NUMBER is behind $DEFAULT_BRANCH and could not be updated; leaving it open"
            exit 0
          fi

          bad=""
          for _ in $(seq 1 40); do
            bad=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.name | startswith("Workers Builds") | not) | select(.status != "completed" or ((.conclusion // "") | IN("success", "neutral", "skipped") | not)) | "\(.name) (\(.status)/\(.conclusion // "none"))"' \
              | paste -sd, -)
            # Legacy commit statuses (external integrations that do not publish check runs) are a separate API.
            bad_status=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status?per_page=100" --paginate \
              --jq '.statuses[] | select(.context | startswith("Workers Builds") | not) | select(.state != "success") | "\(.context) (\(.state))"' \
              | paste -sd, -)
            bad="${bad:+$bad,}$bad_status"
            # Only a pending check is worth waiting for; a finished failure is final.
            if [ -n "$bad" ] && ! grep -qE 'queued|in_progress|waiting|pending|requested' <<<"$bad"; then break; fi
            [ -z "$bad" ] && break
            sleep 30
          done
          [ -z "$bad" ] || { echo "checks still pending or not successful on the head ($bad); not merging"; exit 0; }
          if gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"; then
            echo "merged PR #$PR_NUMBER"
            # The merge moved the default branch: every other open Dependabot branch is now behind. Update them so
            # their CI re-runs and decides on the new base (needs the App token; GITHUB_TOKEN updates start no CI).
            if [ "$HAS_APP" = true ]; then
              for other in $(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate --jq '.[] | select(.user.login == "dependabot[bot]") | .number'); do
                [ "$other" != "$PR_NUMBER" ] || continue
                gh api -X PUT "repos/$GH_REPO/pulls/$other/update-branch" >/dev/null 2>&1 \
                  && echo "updated PR #$other onto the new $DEFAULT_BRANCH tip; its CI run decides" || true
              done
            fi
          else
            echo "::warning::could not merge PR #$PR_NUMBER (conflict or branch protection); leaving it open"
          fi
